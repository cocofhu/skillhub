name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Coverage thresholds
        if: matrix.node == 22
        run: pnpm test:coverage

  pack:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure lib is not committed
        run: |
          tracked=$(git ls-files 'lib' 'lib/**')
          if [[ -n $tracked ]]; then
            echo "lib/ must not be committed:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Build and syntax-check host
        run: |
          pnpm build
          node --check lib/host.js
          node --check lib/install.js
          grep -q 'id: "skillhub-plugin"' lib/client.js
          grep -q "name: 'skillhub-plugin'" cordis.patch.yml
          node -e "if (require('./package.json').name !== 'skillhub-plugin') process.exit(1)"

      - name: Verify package contents
        run: bash .github/scripts/check-pack.sh

      - name: Verify scoped alias identity
        run: |
          node .github/scripts/set-package-identity.mjs @cocofhu/skillhub
          node -e "if (require('./package.json').name !== '@cocofhu/skillhub') process.exit(1)"
          grep -q 'id: "@cocofhu/skillhub"' src/client.js
          grep -q "name: '@cocofhu/skillhub'" cordis.patch.yml
          pnpm build
          grep -q 'id: "@cocofhu/skillhub"' lib/client.js
          bash .github/scripts/check-pack.sh
          node .github/scripts/set-package-identity.mjs skillhub-plugin
          node -e "if (require('./package.json').name !== 'skillhub-plugin') process.exit(1)"
