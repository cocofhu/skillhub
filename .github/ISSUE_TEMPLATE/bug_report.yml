name: Bug 报告
description: 报告可复现的异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并删除日志中的凭证、Cookie、个人数据和私有网络信息。

  - type: input
    id: version
    attributes:
      label: 版本
      description: skillhub 的 git tag 或 commit，以及 DeepSeek Harness 版本
      placeholder: "skillhub: 0.1.0 / abc1234; Harness: x.y.z"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本和浏览器
      placeholder: "Ubuntu 24.04, Node.js 22, Chrome"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题出现在
      options:
        - 搜索卡片
        - 详情弹窗
        - 安装 / 卸载
        - 设置页
        - Agent 工具调用
        - 安装插件 / 启动 Harness
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。请先脱敏，不要提交密钥、Cookie、个人数据或私有地址。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 我已移除敏感和私有信息
          required: true
